[project]
name = "glparchis"
version = "20260214"
description = "Parchís game"
authors = [
    {name = "turulomio",email = "turulomio@yahoo.es"}
]
license = {text = "GPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "pyopengl >=3.1.9",
    "colorama >=0.4.6",
    "PyQt6 >=6.4.0",
    "PyQt6-WebEngine >=6.4.0",
    "pydicts (>=1.1.0,<2.0.0)"
]
 
[tool.poetry]

[tool.poetry.group.dev.dependencies]
poetry = ">=2.3.4"
poethepoet = ">=0.41.0"
qt6-tools = ">=6.5.0.1.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
glparchis = 'glparchis.glparchis:main'
glparchis_shortcuts = 'glparchis.shortcuts:main'

[tool.poe.tasks]
release = { script = "glparchis.poethepoet:release" }
compile = { script = "glparchis.poethepoet:compile" }
